services:
  politician-tracker:
    build: .
    container_name: politician-tracker
    restart: unless-stopped
    ports:
      - "9847:8000"
    volumes:
      - db-data:/app/data
    environment:
      - ADMIN_PASSWORD=changeme
      - SECRET_KEY=change-this-to-a-random-string

volumes:
  db-data:
    driver: local
