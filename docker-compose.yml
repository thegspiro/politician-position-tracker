services:
  politician-tracker:
    build: .
    container_name: politician-tracker
    restart: unless-stopped
    ports:
      - "9847:8000"
    volumes:
      - db-data:/app/data
    environment:
      # Both are required. The application refuses to start on a published
      # default value, so set real ones before bringing the stack up:
      #   ADMIN_PASSWORD  a strong password for the admin panel
      #   SECRET_KEY      a long random string, e.g. `openssl rand -base64 32`
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in a .env file or your environment}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in a .env file or your environment}

volumes:
  db-data:
    driver: local
